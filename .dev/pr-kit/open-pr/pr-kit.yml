name: pr-kit

# pull_request_target runs this workflow from the default branch, whatever the PR's base.
# Under pull_request a PR could edit check.ts or this file and pass its own check.
# So this job checks out the default branch, which carries the checker, and reads the PR only
# through the event payload. A PR's base may be a branch that has no kit, such as a maintenance branch.
# Never check out or run the PR's code here.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  body:
    name: PR body contract
    # Fork and Dependabot PRs skip this check, so they never run on our runners.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: __RUNS_ON__
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
        env:
          HOME: ${{ runner.temp }}/setup-bun
      - run: bun .claude/skills/open-pr/check.ts --event "$GITHUB_EVENT_PATH"
