[project]
name = "family-office"
version = "2.4.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
# The copyright grant lives in LICENSING.md so LICENSE stays detectable as AGPL-3.0.
# Hatchling's default globs do not include that filename, so name it here.
license-files = ["LICENSE", "LICENSING.md"]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "protobuf>=7.36.2",
    "plotly>=7.1.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "requests>=2.32.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.66.1",
    "textual>=8.2.8",
    "urllib3>=2.6.3",
    "xlsxwriter>=3.2.9",
    "yfinance>=1.7.0",
    "questionary>=2.1.1",
    "pillow>=13.0.0",
    "anthropic>=1.15.0",
    "snaptrade-python-sdk>=13.0.42,<14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "buy_ticket_agent"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "pytest-xdist>=3.6.0",
    "pytest-rerunfailures>=16.7",
    "pandas-stubs>=3.0.5.260914",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
    "structlog>=26.1.0",
    "python-json-logger>=4.2.0",
    "growthbook>=3.2.2",
    "vulture>=2.11",
    "import-linter>=2.15",
    "deptry>=0.20.0",
    "pyinstrument>=5.1.3",
    "sentry-sdk>=2.72.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.28",
    "prometheus-client>=0.26.0",
    "pip-audit>=2.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=src --cov=buy_ticket_agent --cov-report=term-missing --cov-fail-under=80 -n auto --reruns 1 --durations=10"
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests (require real API keys)",
]

[tool.ruff]
target-version = "py312"
line-length = 88
include = ["*.py", "*.pyi", "*.pyw", "*.ipynb", "**/pyproject.toml"]
exclude = [".venv", "build", "dist", "node_modules", ".claude/hooks", ".eggs", "__pypackages__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B", "SIM", "C90", "N", "D"]
fixable = ["I", "F401", "UP", "W", "D", "SIM", "F541", "F841", "E"]
unfixable = ["B"]
ignore = ["E501", "E402", "D107", "D205", "D100", "B028"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "B011"]
"*_cli.py" = ["D"]
"__init__.py" = ["F401", "D104"]
"scripts/**/*.py" = ["D"]
".agents/**/*.py" = ["D"]
".claude/**/*.py" = ["D"]
"src/analysis/**/*.py" = ["N803", "N806"]
"src/strategies/**/*.py" = ["N803", "N806"]
"src/utils/**/*.py" = ["N803", "N806"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.vulture]
paths = ["src"]
exclude = ["tests/", ".venv/", "src/*/__init__.py"]
min_confidence = 80
ignore_names = ["_*", "test_*", "setUp", "tearDown"]

[tool.coverage.run]
branch = true
source = ["src", "buy_ticket_agent"]
omit = [
    "src/*/*_cli.py",
    "src/*_cli.py",
    "src/ui/*",
    "src/cli/*",
    "src/data/*",
    "src/reports/*",
    "src/utils/screener.py",
    "src/models/screener_inputs.py",
    "src/models/dashboard_inputs.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "streamlit.*",
    "textual.*",
    "sklearn.*",
    "scipy.*",
    "matplotlib.*",
    "plotly.*",
    "reportlab.*",
    "openpyxl.*",
    "xlsxwriter.*",
    "questionary.*",
    "numpy.*",
    "pytest.*",
    "snaptrade_client.*",
    "dotenv.*",
    "rich.*",
    "rich.text",
    "rich.table",
    "structlog.*",
    "growthbook.*",
    "prometheus_client.*",
]
ignore_missing_imports = true

[tool.uv]
constraint-dependencies = ["nltk>=3.10.4", "certifi>=2026.10.19"]
