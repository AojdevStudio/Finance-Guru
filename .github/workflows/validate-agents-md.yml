name: Validate AGENTS.md

on:
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .github/workflows/validate-agents-md.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint AGENTS.md + CLAUDE.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23
        with:
          globs: |
            AGENTS.md
            CLAUDE.md
          config: .markdownlint.json

      - name: AGENTS.md sanity checks
        run: |
          if [ ! -f AGENTS.md ] && [ ! -f CLAUDE.md ]; then
            echo "::error::Neither AGENTS.md nor CLAUDE.md found"
            exit 1
          fi
          for f in AGENTS.md CLAUDE.md; do
            if [ -f "$f" ]; then
              lines=$(wc -l < "$f")
              echo "$f has $lines lines"
              if [ "$lines" -lt 5 ]; then
                echo "::warning::$f is very short ($lines lines) — consider expanding"
              fi
            fi
          done
