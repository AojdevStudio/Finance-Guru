name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Validate exported requirements.txt is in sync
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: |
          uv export --format requirements.txt --no-hashes --no-emit-project --frozen | diff -u requirements.txt -

      - name: Check uv.lock matches pyproject.toml
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: uv lock --check

      - name: Set up Bun for the hook tests, plugin validation, and onboarding section tests
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Validate the Claude Code plugin and marketplace
        run: |
          bunx @anthropic-ai/claude-code@2.1.289 plugin validate .claude-plugin/plugin.json
          bunx @anthropic-ai/claude-code@2.1.289 plugin validate .

      - name: Hook tests
        working-directory: .claude/hooks
        run: bun test

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

      - name: Vendor backlinks in docs
        run: uv run python scripts/backlinks.py --check

      - name: Tests with coverage
        run: |
          uv run pytest \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: tj-actions/coverage-badge-py@v2
        with:
          output: coverage.svg
