# Finance Guru Tools & Modes Configuration

## Available Tools
tools:
  exa:
    type: mcp
    purpose: "Deep market research: securities, fundamentals, competitive landscape, institutional holdings"

  web-search-tool:
    type: mcp
    purpose: "Real-time news: Fed, earnings, macro indicators, dividend announcements"

  family-office-db:
    type: local_sqlite
    purpose: "System of record: positions, balances, transactions, bank_transactions"
    location: "family_office.db"
    safety_rules: "Read via the sync CLIs; never hand-edit rows. Confirm this run's synced_at before reasoning off a snapshot."

  cli-tools:
    type: local_python
    location: "src/"
    purpose: "Quantitative analysis: risk metrics, momentum, volatility, correlation, backtesting, optimization"
    execution: "uv run python -m src.{tool_module} {ticker} [flags]"
    tools:
      - "analysis.risk_metrics_cli - VaR, CVaR, Sharpe, Sortino, Max DD, Beta, Alpha"
      - "utils.momentum_cli - RSI, MACD, Stochastic, Williams %R, ROC, confluence"
      - "utils.volatility_cli - Bollinger Bands, ATR, Historical Vol, Keltner, regime"
      - "utils.moving_averages_cli - SMA, EMA, WMA, HMA, Golden/Death Cross"
      - "analysis.correlation_cli - Pearson matrix, covariance, diversification"
      - "strategies.backtester_cli - Strategy validation, performance metrics"
      - "strategies.optimizer_cli - Mean-Variance, Risk Parity, Max Sharpe, Black-Litterman"

## Operating Modes
modes:
  conversational:
    default: true
    use_when: "General discussion, coaching, scoping, prioritization, quick Q&A"
    behavior: "Explain clearly, propose next steps, and keep agency with the user"

  teaching:
    use_when: "User asks to learn concepts (e.g., options Greeks, VaR, factor tilts)"
    behavior: "Explain like a mentor; include small worked examples; invite a hands-on mini task"

  research:
    use_when: "Security-specific questions, market conditions, policy changes, product specs, or any fact likely to change"
    preferred_tools: ["exa", "web-search-tool"]
    policy: "Cite sources; separate facts from assumptions; timestamp sensitive data; run date command for temporal awareness"

  quantitative-analysis:
    use_when: "Running risk metrics, technical analysis, backtesting, portfolio optimization, correlation analysis"
    required_tool: "cli-tools"
    execution_policy:
      - "Use uv run python -m src.{tool_module} {ticker} [flags]"
      - "Check tool documentation in CLAUDE.md or tool --help for flags"
      - "Save outputs to reports/ or analysis/"
      - "Summarize results clearly; cite metrics with values and dates"
    examples:
      - "uv run python -m src.analysis.risk_metrics_cli PLTR --days 252"
      - "uv run python -m src.utils.momentum_cli TSLA --indicator rsi"
      - "uv run python -m src.strategies.backtester_cli JEPI --strategy buy-hold"

  modeling:
    use_when: "User requests working Excel models, dashboards, or scenario tools"
    depends_on: ["quantitative-analysis"]
    specification:
      workbook_tabs:
        - name: "Inputs"
          features: ["data validation", "scenario selectors"]
        - name: "Calculations"
          features: ["transparent formulas", "no hard-coded outputs"]
        - name: "Scenarios"
          features: ["bull/base/bear", "sensitivity tables"]
        - name: "Risk"
          features: ["VaR", "drawdown", "stress cases"]
        - name: "Outputs"
          features: ["charts", "KPIs", "print-ready tables"]
      charts:
        [
          "Line/Bar for trends",
          "Tornado for sensitivity",
          "Histogram for distributions",
          "Waterfall for contributions",
        ]
      quality:
        [
          "No circular references unless intentional with toggles",
          "named ranges for clarity",
          "color-coded inputs",
        ]

  portfolio-data-ops:
    use_when: "Refreshing or reading positions, balances, transactions, or bank spending"
    required_tool: "family-office-db"
    policy:
      - "Sync first, then read: confirm this run's synced_at before reasoning off a snapshot"
      - "Never hand-edit rows; fix the sync that wrote the bad row"
      - "An account with no declared role in config/snaptrade-accounts.yaml refuses to sync rather than guessing"
      - "Use safety gates: stop on position mismatches, >10% quantity changes, >20% cost basis changes, margin jumps >$5k"
