<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fg-guard-title fg-guard-desc">
      <title id="fg-guard-title">Buy-ticket guardrail flow</title>
      <desc id="fg-guard-desc">A settled deposit triggers a model proposal; trusted context is assembled from portfolio NAV, the configured margin rate, and Layer 3 ITC risk; the guardrail either blocks with a typed reason or persists a draft and notifies, with retries reusing the persisted draft.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first -->
      <line x1="480" y1="88" x2="480" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="184" x2="480" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="280" x2="480" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="356" x2="656" y2="356" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="480" y1="396" x2="480" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="736" y1="384" x2="736" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M816,472 H840 Q848,472 848,464 V352 Q848,344 840,344 H816" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="612" y="336" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="628" y="345" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASS</text>
      <rect x="488" y="412" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="488" y="421" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">FAIL · MISSING</text>
      <rect x="856" y="400" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="856" y="409" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">RETRY REUSES</text>

      <!-- Editorial aside -->
      <text x="40" y="332" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Missing NAV, missing rate, or an</text>
      <text x="40" y="352" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">unrun Layer 3 score is a block,</text>
      <text x="40" y="372" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">never a pass.</text>

      <!-- Start oval -->
      <rect x="380" y="40" width="200" height="48" rx="20" fill="#f5f5f5"/>
      <rect x="380" y="40" width="200" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="480" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Settled deposit lands</text>
      <text x="480" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SimpleFIN · posted, not pending</text>

      <!-- Step: model proposal -->
      <rect x="380" y="128" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="128" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Model drafts a proposal</text>
      <text x="480" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tickers · amounts · thesis</text>

      <!-- Step: trusted context -->
      <rect x="380" y="224" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="224" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trusted context assembled</text>
      <text x="480" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">equity NAV · margin rate · Layer 3 ITC</text>

      <!-- Decision diamond (focal) -->
      <polygon points="480,316 600,356 480,396 360,356" fill="#f5f5f5"/>
      <polygon points="480,316 600,356 480,396 360,356" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="480" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Three guardrails</text>
      <text x="480" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">30% cap · 2x coverage · ITC</text>

      <!-- Blocked oval -->
      <rect x="380" y="448" width="200" height="48" rx="20" fill="#f5f5f5"/>
      <rect x="380" y="448" width="200" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="480" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Blocked</text>
      <text x="480" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">typed reason · nothing written</text>

      <!-- Step: persist draft -->
      <rect x="656" y="328" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="656" y="328" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="736" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Persist the draft</text>
      <text x="736" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tickets/ · stable run id</text>

      <!-- Step: notify -->
      <rect x="656" y="432" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="656" y="432" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="736" y="456" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Notify</text>
      <text x="736" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sent · skipped · failed</text>

      <!-- Legend -->
      <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="568" width="14" height="10" rx="5" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="60" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start or end</text>
      <rect x="160" y="568" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>
      <polygon points="247,568 256,573 247,578 238,573" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="260" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision, fails closed</text>
      <line x1="400" y1="574" x2="428" y2="574" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="436" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Retry path, idempotent</text>
    </svg>
