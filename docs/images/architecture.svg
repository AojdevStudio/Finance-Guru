<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fg-arch-title fg-arch-desc">
      <title id="fg-arch-title">Finance Guru architecture</title>
      <desc id="fg-arch-desc">Brokerage, bank, and CSV sources sync through refresh_all into a private SQLite instance; typed calculators read the store and market data, are driven by skills and agents inside Claude Code or Codex, and write analysis artifacts back into the instance.</desc>
